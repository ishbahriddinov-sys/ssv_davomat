<!doctype html>
<html lang="uz-Cyrl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Давомат</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{
      --bg: var(--tg-theme-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #1b2733);
      --hint: var(--tg-theme-hint-color, #7688a1);
      --card: var(--tg-theme-secondary-bg-color, #f4f7fb);
      --btn: var(--tg-theme-button-color, #2f80ed);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
      --navy:#12395f; --blue:#2f80ed; --green:#12a97a; --red:#e0484b; --amber:#d99400;
      --border: color-mix(in srgb, var(--text) 12%, transparent);
      --shadow: 0 4px 16px rgba(18,57,95,.08), 0 1px 3px rgba(18,57,95,.06);
      --shadow-sm: 0 2px 8px rgba(18,57,95,.06);
      --neutral-btn: color-mix(in srgb, var(--text) 8%, var(--card));
    }
    /* Dark theme: soften/remove shadows, adjust neutral surfaces */
    @media (prefers-color-scheme: dark){
      :root{
        --shadow: 0 2px 10px rgba(0,0,0,.35);
        --shadow-sm: 0 1px 6px rgba(0,0,0,.28);
        --neutral-btn: color-mix(in srgb, var(--text) 14%, var(--card));
      }
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{max-width:100%;overflow-x:hidden}
    body{
      font-family:-apple-system,"Segoe UI",Roboto,sans-serif;
      background:var(--bg);color:var(--text);font-size:15px;
      padding:0 14px 44px;line-height:1.45;
      -webkit-font-smoothing:antialiased;
    }
    #app{animation:fade .35s ease both}
    @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}

    /* ---------- Header band ---------- */
    .head{
      display:flex;align-items:center;gap:13px;
      margin:0 -14px 18px;padding:20px 18px 18px;
      background:
        linear-gradient(135deg, rgba(47,128,237,.16), rgba(18,57,95,.10) 60%, transparent),
        var(--card);
      border-bottom:1px solid var(--border);
      border-radius:0 0 22px 22px;
    }
    .head img{
      width:46px;height:46px;border-radius:14px;background:#fff;object-fit:contain;
      padding:4px;box-shadow:var(--shadow-sm);flex-shrink:0;
    }
    .head b{font-size:17px;font-weight:700;display:block;letter-spacing:-.2px}
    .head .role{font-size:12.5px;color:var(--hint);margin-top:1px;display:block}

    .loader{text-align:center;color:var(--hint);padding:48px 0;font-size:14px}
    h3{font-size:16px;font-weight:700;margin:4px 0 14px;letter-spacing:-.2px}

    /* ---------- Summary pills (segmented) ---------- */
    .summary{
      display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px;
      animation:pop .4s ease both;
    }
    .pill{
      background:var(--card);border-radius:15px;padding:12px 6px;text-align:center;
      box-shadow:var(--shadow-sm);border:1px solid var(--border);
      transition:transform .15s ease;
    }
    .pill:active{transform:scale(.97)}
    .pill .n{font-size:22px;font-weight:800;line-height:1.1;letter-spacing:-.5px}
    .pill .l{font-size:10.5px;color:var(--hint);margin-top:3px;font-weight:500}
    .pill.g .n{color:var(--green)} .pill.r .n{color:var(--red)} .pill.a .n{color:var(--amber)}

    /* ---------- Cards ---------- */
    .card{
      background:var(--card);border-radius:16px;padding:14px 15px;margin-bottom:11px;
      box-shadow:var(--shadow);border:1px solid var(--border);
      animation:pop .35s ease both;
    }
    .row{display:flex;align-items:center;gap:11px}
    .avatar{
      width:42px;height:42px;border-radius:13px;
      background:linear-gradient(135deg, var(--blue), var(--navy));
      color:#fff;display:flex;align-items:center;justify-content:center;
      font-weight:700;font-size:15px;flex-shrink:0;box-shadow:var(--shadow-sm);
    }
    .info{flex:1;min-width:0}
    .info b{font-size:15px;font-weight:650;overflow-wrap:anywhere;word-break:break-word;display:block;line-height:1.3}
    .info .meta{font-size:12px;color:var(--hint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}

    /* ---------- Action buttons ---------- */
    .actions{display:flex;gap:8px;margin-top:12px}
    .btn{
      flex:1;border:none;border-radius:12px;padding:12px;font-size:14px;font-weight:650;
      cursor:pointer;background:var(--neutral-btn);color:var(--text);
      transition:transform .12s ease, background .2s ease, box-shadow .2s ease;
      font-family:inherit;
    }
    .btn:active{transform:scale(.97)}
    .btn.yes.on{background:var(--green);color:#fff;box-shadow:0 3px 12px rgba(18,169,122,.35)}
    .btn.no.on{background:var(--red);color:#fff;box-shadow:0 3px 12px rgba(224,72,75,.32)}

    .absent-form{margin-top:12px;display:none}
    .absent-form.open{display:block;animation:pop .28s ease both}
    textarea{
      width:100%;border:1px solid var(--border);border-radius:12px;padding:11px;
      font-size:14px;font-family:inherit;min-height:54px;margin-bottom:9px;
      background:var(--bg);color:var(--text);resize:vertical;transition:border-color .2s ease;
    }
    textarea:focus{outline:none;border-color:var(--blue)}
    .file{font-size:13px;margin-bottom:10px;display:block;color:var(--hint)}
    .save{background:var(--btn);color:var(--btn-text);width:100%;box-shadow:0 3px 12px rgba(47,128,237,.28)}

    /* ---------- Badges ---------- */
    .badge{
      display:inline-block;padding:3px 10px;border-radius:20px;
      font-size:11.5px;font-weight:650;line-height:1.4;vertical-align:middle;
    }
    .badge.present{background:color-mix(in srgb, var(--green) 16%, transparent);color:var(--green)}
    .badge.late{background:color-mix(in srgb, var(--amber) 18%, transparent);color:var(--amber)}
    .badge.absent{background:color-mix(in srgb, var(--red) 16%, transparent);color:var(--red)}
    .badge.nm{background:color-mix(in srgb, var(--hint) 18%, transparent);color:var(--hint)}

    /* ---------- Stat grid ---------- */
    .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
    .stat{
      background:var(--card);border-radius:16px;padding:18px;
      box-shadow:var(--shadow);border:1px solid var(--border);
      animation:pop .35s ease both;
    }
    .stat .v{font-size:30px;font-weight:800;color:var(--navy);letter-spacing:-.8px;line-height:1}
    @media (prefers-color-scheme: dark){ .stat .v{color:var(--text)} }
    .stat .k{font-size:12.5px;color:var(--hint);margin-top:5px;font-weight:500}

    /* ---------- History rows ---------- */
    .hrow{
      display:flex;justify-content:space-between;align-items:center;gap:10px;
      padding:12px 0;border-bottom:1px solid var(--border);font-size:14px;
    }
    .hrow:last-child{border-bottom:none}

    /* ---------- States & misc ---------- */
    .err{text-align:center;color:var(--hint);padding:36px 18px;line-height:1.55;font-size:14px}
    .err::before{content:"⚠️";display:block;font-size:30px;margin-bottom:10px;opacity:.9}
    .proof{
      font-size:12.5px;color:var(--btn);text-decoration:none;margin-left:6px;
      display:inline-block;transition:transform .12s ease;
    }
    .proof:active{transform:scale(.9)}
    input[type=date]{
      border:1px solid var(--border);border-radius:12px;padding:11px 13px;font-size:14px;
      background:var(--card);color:var(--text);margin-bottom:14px;font-family:inherit;
      box-shadow:var(--shadow-sm);width:100%;-webkit-appearance:none;
    }
    input[type=date]:focus{outline:none;border-color:var(--blue)}
    .saved{color:var(--green);font-size:12.5px;font-weight:600;margin-left:4px}
  </style>
</head>
<body>
  <div class="head" id="head" style="display:none">
    <img src="/static/logo.png" alt="logo">
    <div><b id="hName">—</b><span class="role" id="hRole"></span></div>
  </div>
  <div id="app"><div class="loader">Юкланмоқда…</div></div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const INIT = tg?.initData || "";
const app = document.getElementById("app");

function esc(s){return (s??"").toString().replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function initials(n){const p=(n||"?").trim().split(/\s+/);return((p[0]||"")[0]||"")+((p[1]||"")[0]||"");}
const ROLE_UZ={admin:"Администратор",hr:"Оператор (HR)",manager:"Раҳбар",employee:"Ходим"};
const STATUS={present:["келди","present"],late:["кечикди","late"],absent:["келмади","absent"],completed:["якунланди","present"],on_leave:["таътилда","present"],not_marked:["белгиланмаган","nm"]};

async function wapi(path, opts={}){
  opts.headers = Object.assign({"X-Telegram-Init-Data": INIT}, opts.headers||{});
  const res = await fetch(path, opts);
  if(!res.ok){ const t=await res.json().catch(()=>({})); throw new Error(t.detail||("HTTP "+res.status)); }
  return res.json();
}

function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}

async function boot(){
  if(!INIT){ app.innerHTML=`<div class="err">Илова Telegram ичида очилиши керак.</div>`; return; }
  let me;
  try{ me = await wapi("/api/webapp/me"); }
  catch(e){ app.innerHTML=`<div class="err">${esc(e.message)}</div>`; return; }

  document.getElementById("head").style.display="flex";
  document.getElementById("hName").textContent = me.name;
  document.getElementById("hRole").textContent = (ROLE_UZ[me.role]||me.role) + (me.department? " · "+me.department : "");

  if(me.role==="hr" || me.role==="admin") return renderRollcall();
  return renderHistory();
}

// ---------- Йўқлама (оператор) ----------
async function renderRollcall(){
  app.innerHTML = `<h3>✅ Йўқлама</h3>
    <input type="date" id="d" value="${today()}">
    <div class="summary" id="sum"></div>
    <div id="list"><div class="loader">Юкланмоқда…</div></div>`;
  document.getElementById("d").addEventListener("change", loadRoster);
  loadRoster();
}
async function loadRoster(){
  const d = document.getElementById("d").value;
  let data; try{ data = await wapi("/api/webapp/rollcall?work_date="+d); }
  catch(e){ document.getElementById("list").innerHTML=`<div class="err">${esc(e.message)}</div>`; return; }
  document.getElementById("sum").innerHTML =
    `<div class="pill"><div class="n">${data.total}</div><div class="l">Жами</div></div>
     <div class="pill g"><div class="n">${data.present}</div><div class="l">Келди</div></div>
     <div class="pill r"><div class="n">${data.absent}</div><div class="l">Келмади</div></div>
     <div class="pill a"><div class="n">${data.not_marked}</div><div class="l">Белгиланмаган</div></div>`;
  const list = document.getElementById("list");
  if(!data.rows.length){ list.innerHTML=`<div class="err">Ходимлар йўқ.</div>`; return; }
  list.innerHTML = data.rows.map(r=>{
    const proof = r.has_proof&&r.attendance_id ? `<a class="proof" href="/api/rollcall/proof/${r.attendance_id}" target="_blank">📎</a>`:"";
    return `<div class="card" id="c${r.user_id}">
      <div class="row">
        <div class="avatar">${esc(initials(r.full_name)).toUpperCase()}</div>
        <div class="info"><b>${esc(r.full_name)}</b>${r.is_late?' <span class="badge late">кечикди</span>':''}
          <div class="meta">${esc(r.position||'—')} · ${esc(r.department||'—')}</div></div>
      </div>
      <div class="actions">
        <button class="btn yes ${r.status==='present'?'on':''}" onclick="mark(${r.user_id},'present')">✅ Келди</button>
        <button class="btn no ${r.status==='absent'?'on':''}" onclick="toggleAbsent(${r.user_id})">❌ Келмади</button>
      </div>
      <div class="absent-form ${r.status==='absent'?'open':''}" id="af${r.user_id}">
        <textarea id="rs${r.user_id}" placeholder="Йўқлик сабаби…">${esc(r.absence_reason||'')}</textarea>
        <label class="file">Исботловчи ҳужжат: <input type="file" id="fl${r.user_id}" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx"></label>
        <button class="btn save" onclick="mark(${r.user_id},'absent')">💾 Сақлаш ${proof}</button>
        <span class="saved" id="sv${r.user_id}"></span>
      </div>
    </div>`;
  }).join("");
}
function toggleAbsent(uid){ document.getElementById("af"+uid).classList.toggle("open"); }
async function mark(uid, kind){
  const fd = new FormData();
  fd.append("user_id", uid); fd.append("work_date", document.getElementById("d").value);
  let url = "/api/webapp/rollcall/present";
  if(kind==="absent"){
    url = "/api/webapp/rollcall/absent";
    fd.append("reason", document.getElementById("rs"+uid).value);
    const f = document.getElementById("fl"+uid).files[0];
    if(f) fd.append("file", f);
  }
  try{ await wapi(url,{method:"POST",body:fd}); if(tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("success"); loadRoster(); }
  catch(e){ alert(e.message); }
}

// ---------- Тарих (ходим) ----------
async function renderHistory(){
  let data; try{ data = await wapi("/api/webapp/history"); }
  catch(e){ app.innerHTML=`<div class="err">${esc(e.message)}</div>`; return; }
  const rows = data.rows.map(a=>{
    const st = STATUS[a.is_late?"late":a.status] || STATUS[a.status] || [a.status,"nm"];
    return `<div class="hrow"><span>${a.date}</span>
      <span>${a.check_in?("келиш "+a.check_in):"—"} <span class="badge ${st[1]}">${st[0]}</span></span></div>`;
  }).join("") || `<div class="err">Тарих бўш.</div>`;
  app.innerHTML = `<h3>📊 Давомат тарихи (30 кун)</h3>
    <div class="summary">
      <div class="pill a"><div class="n">${data.late}</div><div class="l">Кечикиш</div></div>
      <div class="pill r"><div class="n">${data.absent}</div><div class="l">Йўқ</div></div>
    </div>
    <div class="card">${rows}</div>`;
}

// ---------- Статистика (админ) ----------
async function renderStats(){
  let s; try{ s = await wapi("/api/webapp/stats"); }
  catch(e){ app.innerHTML=`<div class="err">${esc(e.message)}</div>`; return; }
  app.innerHTML = `<h3>📊 Умумий статистика</h3>
    <div class="stat-grid">
      <div class="stat"><div class="v">${s.total_users}</div><div class="k">Жами ходимлар</div></div>
      <div class="stat"><div class="v">${s.present_today}</div><div class="k">Бугун ишда</div></div>
      <div class="stat"><div class="v">${s.late_today}</div><div class="k">Кечиккан</div></div>
      <div class="stat"><div class="v">${s.absent_today}</div><div class="k">Йўқ</div></div>
      <div class="stat"><div class="v">${s.on_leave_today}</div><div class="k">Таътилда</div></div>
      <div class="stat"><div class="v">${s.attendance_rate}%</div><div class="k">Давомат</div></div>
    </div>`;
}

boot();
</script>
</body>
</html>
